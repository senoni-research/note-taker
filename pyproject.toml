[project]
name = "note-taker"
version = "0.1.0"
description = "Memory-only local meeting notetaker (WhisperLiveKit + Ollama)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "whisperlivekit>=0.2.24",
    "sounddevice>=0.5.0",
    "numpy>=2.0",
    "httpx>=0.28",
    "websockets>=14.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
mlx = ["mlx-whisper"]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
note-taker = "note_taker.cli:main"
note-taker-asr = "note_taker.scripts.start_asr:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/note_taker"]

[tool.uv]
package = true
